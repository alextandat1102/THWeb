<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra chuỗi</title>

    <script src="../JS/jquery-3.7.1.min.js"></script>
</head>

<body>

    <h1>Bài 3. Tên đăng nhập</h1>
    <input type="number" id="txt">
    <button id="click">Kiểm tra số điện thoại </button>

    <p id="result"></p>
    <script>
        $("#click").on("click", function() {
            let s = $("#txt").val();
            let regex = /^[0]\d{9}$/;

            if (regex.test(s)) {
                $("#result").text("Số điện thoại hợp lệ");
            } else {
                $("#result").text("Số điện thoại không hợp lệ!");
            }
        });
    </script>
</body>

</html>
