<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra chuỗi</title>

    <script src="../JS/jquery-3.7.1.min.js"></script>
</head>

<body>

    <h1>Bài 5. Email</h1>
    <input type="text" id="txt">
    <button id="click">Kiểm tra tên đăng nhập</button>

    <p id="result"></p>
    <script>
        $("#click").on("click", function() {
            let s = $("#txt").val();
            let regex = /^\S+@\S+\.\S+$/;

            if (regex.test(s)) {
                $("#result").text("Email hợp lệ!");
            } else {
                $("#result").text("Email không hợp lệ!");
            }
        });
    </script>
</body>

</html>
