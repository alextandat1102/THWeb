<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra chuỗi</title>

    <script src="../JS/jquery-3.7.1.min.js"></script>
</head>

<body>
    <h1>Bài 2. Mã sinh viên</h1>
    <input type="number" id="txt2">
    <button id="click2">Kiểm tra mssv</button>

    <p id="result2"></p>
    <script>
        $("#click2").on("click", function() {
            let s = $("#txt2").val();
            let regex = /^[0-9]{10}$/;

            if (regex.test(s)) {
                $("#result2").text("Chuỗi hợp lệ!");
            } else {
                $("#result2").text("Chuỗi không hợp lệ!");
            }
        });
    </script>
</body>

</html>
