<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra chuỗi</title>

    <script src="../JS/jquery-3.7.1.min.js"></script>
</head>

<body>
    <h1>BÀI 1: Chỉ gồm chữ số</h1>

    <input type="text" id="txt">
    <button id="click">Kiểm tra chuỗi</button>

    <p id="result"></p>

    <h1>Bài 2. Mã sinh viên</h1>
    <input type="number" id="txt2">
    <button id="click2">Kiểm tra mssv</button>

    <p id="result2"></p>

    <h1>Bài 3. Tên đăng nhập</h1>
    <input type="text" id="txt3">
    <button id="click3">Kiểm tra tên đăng nhập</button>

    <p id="result3"></p>
    <script>
        $("#click").on("click", function() {
            let s = $("#txt").val();
            let regex = /^\d+$/;

            if (regex.test(s)) {
                $("#result").text("Chuỗi hợp lệ!");
            } else {
                $("#result").text("Chuỗi không hợp lệ!");
            }
        });
        $("#click2").on("click", function() {
            let s = $("#txt2").val();
            let regex = /^[0-9]{10}$/;

            if (regex.test(s)) {
                $("#result2").text("Chuỗi hợp lệ!");
            } else {
                $("#result2").text("Chuỗi không hợp lệ!");
            }
        });
        $("#click3").on("click", function() {
            let s = $("#txt3").val();
            let regex = /[_][a-z]{5,15}/;

            if (regex.test(s)) {
                $("#result3").text("Chuỗi hợp lệ!");
            } else {
                $("#result3").text("Chuỗi không hợp lệ!");
            }
        });
    </script>
</body>

</html>
